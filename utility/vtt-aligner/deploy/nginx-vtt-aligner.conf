# /etc/nginx/sites-available/vtt-aligner  (then: ln -s ../sites-available/vtt-aligner /etc/nginx/sites-enabled/)
server {
    listen 80;
    listen [::]:80;
    server_name vtt.example.internal;          # change me

    # The API has no authentication of its own: only the front service should
    # reach it. Either listen on an internal address only, e.g.
    #     listen 10.0.0.12:80;   (instead of the two listen lines above)
    # and/or allow just the front service's address(es):
    # allow 10.0.0.5;            # front service
    # allow 127.0.0.1;           # same machine
    # deny all;

    root /opt/vtt-aligner/public;               # only public/ is exposed
    index index.php;

    client_max_body_size 310m;                  # >= max_upload_mb in config.ini
    client_body_timeout 600s;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        # Match your PHP version: `ls /run/php/` shows the socket name.
        # A wrong name gives "502 Bad Gateway".
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 120s;
        fastcgi_hide_header X-Powered-By;
    }

    # Nothing else in public/ is served (no dotfiles, no .user.ini).
    location ~ /\. { return 404; }
    location ~ \.php$ { return 404; }
}
